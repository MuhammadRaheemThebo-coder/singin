<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ================= SIGN UP PAGE ================= -->
        <div id="signupPage">

            <div class="logo">
                S
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Create your account to continue</p>

            <div id="signupMessage"></div>

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Enter your name">
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create password">
            </div>

            <button class="btn" onclick="signup()">
                Create Account
            </button>

            <p class="switch">
                Already have an account?
                <span onclick="showLogin()">Login</span>
            </p>

        </div>


        <!-- ================= LOGIN PAGE ================= -->
        <div id="loginPage">

            <div class="logo">
                L
            </div>

            <h1>Welcome Back</h1>
            <p class="subtitle">Login to your account</p>

            <div id="loginMessage"></div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>

            <button class="btn" onclick="login()">
                Login
            </button>

            <p class="switch">
                Don't have an account?
                <span onclick="showSignup()">Create Account</span>
            </p>

        </div>


        <!-- ================= WELCOME PAGE ================= -->
        <div id="welcomePage">

            <div class="welcome-icon">
                ✓
            </div>

            <h1 class="welcome-title">
                Welcome to My Website
            </h1>

            <div class="user-name" id="welcomeName">
                User
            </div>

            <p class="welcome-text">
                You have successfully logged in.
            </p>

            <button class="btn logout" onclick="logout()">
                Logout
            </button>

        </div>

    </div>


   <script src="app.js"></script>
</body>
</html>
